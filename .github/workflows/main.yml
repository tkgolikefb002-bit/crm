name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'

    - name: Generate Gradle Wrapper and Build APK
      run: |
        # Khởi tạo Gradle Wrapper phiên bản 7.5 không dùng daemon
        gradle wrapper --gradle-version 7.5 --no-daemon
        
        # Cấp quyền thực thi cho gradlew
        chmod +x gradlew
        
        # Chạy build APK ở chế độ không dùng daemon để tránh lỗi tiến trình
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
