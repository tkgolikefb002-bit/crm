name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '7.5'
        cache-read-only: true

    - name: Setup Android SDK Environment
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        mkdir -p /usr/local/lib/android/sdk/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > /usr/local/lib/android/sdk/licenses/android-sdk-license

    - name: Build Android APK Stable
      run: |
        # Chạy build với giới hạn RAM tối ưu (-Xmx1024m) và không dùng daemon để tránh sập tiến trình
        gradle :app:assembleDebug -Dorg.gradle.jvmargs="-Xmx1024m -Dfile.encoding=UTF-8" --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
