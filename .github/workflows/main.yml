name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle & Setup Android Environment
      run: |
        # Cài đặt Gradle trực tiếp trên hệ thống Ubuntu bằng apt để tránh lỗi wrapper
        sudo apt-get update
        sudo apt-get install -y gradle

        # Thiết lập biến môi trường Android SDK mặc định của runner
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        mkdir -p /usr/local/lib/android/sdk/licenses
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > /usr/local/lib/android/sdk/licenses/android-sdk-license

    - name: Build APK Directly
      run: |
        # Chạy trực tiếp lệnh gradle của hệ thống ở chế độ không dùng daemon
        gradle assembleDebug --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
